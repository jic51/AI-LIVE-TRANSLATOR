<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Live Translator</title>
  <meta name="description" content="Traductor en tiempo real inglés ↔ español" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#2563eb', light: '#eff6ff', dark: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .pulse-ring {
      animation: pulse-ring 1.4s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(37,99,235,.35); }
      70%  { box-shadow: 0 0 0 16px rgba(37,99,235,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); }
    }
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    textarea { resize: none; }
    #interim-original { color: #94a3b8; }
    #interim-translated { color: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-gray-100 px-4 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🌐</span>
      <h1 class="text-lg font-semibold text-gray-900">AI Live Translator</h1>
    </div>
    <div class="flex items-center gap-3">
      <!-- TTS toggle -->
      <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
        <span>Escuchar traducción</span>
        <button id="tts-toggle" role="switch" aria-checked="true"
          class="relative inline-flex h-6 w-11 items-center rounded-full bg-brand transition-colors focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2"
          onclick="toggleTts()">
          <span id="tts-thumb" class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6 shadow"></span>
        </button>
      </label>
      <!-- Backend URL -->
      <button onclick="openSettings()" class="text-gray-400 hover:text-gray-700 transition-colors" title="Configuración">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-4 py-6 gap-4">

    <!-- Language direction selector -->
    <div class="flex items-center justify-center gap-3">
      <span id="lang-source-label" class="text-sm font-semibold text-gray-700 w-24 text-right">Inglés</span>
      <button id="swap-btn" onclick="swapLanguages()"
        class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 bg-white hover:bg-gray-50 hover:border-brand transition-all shadow-sm"
        title="Intercambiar idiomas">
        <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
        </svg>
      </button>
      <span id="lang-target-label" class="text-sm font-semibold text-gray-700 w-24 text-left">Español</span>
    </div>

    <!-- Transcript panels -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">

      <!-- Original -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
          <span id="panel-source-label" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Inglés — original</span>
          <button onclick="clearAll()" class="text-xs text-gray-400 hover:text-red-500 transition-colors">Limpiar</button>
        </div>
        <div class="flex-1 p-4 overflow-y-auto min-h-[140px]" id="original-box">
          <p id="final-original" class="text-gray-800 text-base leading-relaxed"></p>
          <p id="interim-original" class="text-base leading-relaxed italic"></p>
        </div>
        <!-- Text input fallback -->
        <div class="border-t border-gray-100 px-4 py-2 flex gap-2">
          <textarea id="text-input" rows="2"
            placeholder="O escribe aquí…"
            class="flex-1 text-sm text-gray-700 placeholder-gray-300 border-0 outline-none bg-transparent"></textarea>
          <button onclick="submitText()"
            class="self-end text-xs font-medium text-brand hover:text-brand-dark transition-colors pb-1">
            Traducir
          </button>
        </div>
      </div>

      <!-- Translated -->
      <div class="bg-brand-light rounded-2xl border border-blue-100 shadow-sm flex flex-col overflow-hidden">
        <div class="px-4 py-3 border-b border-blue-100 flex items-center justify-between">
          <span id="panel-target-label" class="text-xs font-semibold text-brand uppercase tracking-wider">Español — traducción</span>
          <span id="translating-indicator" class="hidden text-xs text-brand animate-pulse">Traduciendo…</span>
        </div>
        <div class="flex-1 p-4 overflow-y-auto min-h-[140px]" id="translated-box">
          <p id="final-translated" class="text-gray-800 text-base leading-relaxed font-medium"></p>
          <p id="interim-translated" class="text-base leading-relaxed italic"></p>
        </div>
        <!-- TTS playback status -->
        <div id="tts-status" class="hidden border-t border-blue-100 px-4 py-2">
          <p class="text-xs text-brand">🔊 Reproduciendo…</p>
        </div>
      </div>

    </div>

    <!-- Mic button -->
    <div class="flex flex-col items-center gap-3 py-2">
      <button id="mic-btn" onclick="toggleMic()"
        class="w-16 h-16 rounded-full bg-brand text-white flex items-center justify-center shadow-lg hover:bg-brand-dark transition-all focus:outline-none focus:ring-4 focus:ring-blue-200"
        title="Pulsa para hablar">
        <svg id="mic-icon" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 1a4 4 0 014 4v6a4 4 0 01-8 0V5a4 4 0 014-4zm0 2a2 2 0 00-2 2v6a2 2 0 004 0V5a2 2 0 00-2-2zm7 7a1 1 0 011 1 8 8 0 01-7 7.938V21h2a1 1 0 110 2H9a1 1 0 110-2h2v-2.062A8 8 0 014 11a1 1 0 112 0 6 6 0 0012 0 1 1 0 011-1z"/>
        </svg>
      </button>
      <p id="mic-label" class="text-sm text-gray-400">Pulsa el micrófono para empezar</p>
    </div>

    <!-- Status / error bar -->
    <div id="status-bar" class="hidden rounded-xl px-4 py-3 text-sm fade-in"></div>

  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm">
      <h2 class="text-base font-semibold text-gray-900 mb-4">Configuración</h2>
      <label class="block text-sm text-gray-600 mb-1">URL del backend</label>
      <input id="backend-url-input" type="url"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-800 outline-none focus:ring-2 focus:ring-brand mb-4"
        placeholder="http://localhost:8000" />
      <div class="flex gap-3 justify-end">
        <button onclick="closeSettings()" class="text-sm text-gray-500 hover:text-gray-800 transition-colors">Cancelar</button>
        <button onclick="saveSettings()" class="bg-brand text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-brand-dark transition-colors">Guardar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
